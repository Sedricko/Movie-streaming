name: Android

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1" # semanal: mantém vivo o cache da chave de assinatura (o GitHub apaga cache sem uso há 7 dias)

env:
  # Commit do TDLib usado no app. Mudar aqui força recompilar o TDLib (o resultado fica em cache).
  TD_REF: 0e88653dcbf4e44c73cb655a05b58cd749a91169

jobs:
  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: tdlib
          key: tdlib-android-${{ env.TD_REF }}-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gperf php-cli
      - if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-tdlib.sh "$TD_REF"
      - run: cat tdlib/COMMIT && find tdlib -name '*.so' | xargs ls -la
      - uses: actions/upload-artifact@v4
        with: { name: tdlib, path: tdlib, retention-days: 7 }

  app:
    needs: tdlib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tdlib, path: tdlib }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # Mesma chave de assinatura em todo build: sem isso cada APK sai com chave nova e o Android
      # recusa instalar por cima ("conflito com pacote existente"). A chave fica no cache privado do
      # Actions, nunca no repositório (público). Só o main grava; os outros branches leem a do main.
      - name: Chave de assinatura fixa
        uses: actions/cache/restore@v4
        with:
          path: ~/lumicast-debug.keystore
          key: lumicast-debug-keystore-v2
      - name: Criar a chave (só se o cache ainda não tiver)
        run: |
          test -f ~/lumicast-debug.keystore || keytool -genkeypair -keystore ~/lumicast-debug.keystore \
            -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
          echo "LUMICAST_DEBUG_KEYSTORE=$HOME/lumicast-debug.keystore" >> "$GITHUB_ENV"
      - name: Versões estáveis mais recentes (referência)
        continue-on-error: true
        run: |
          g() { curl -s "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" | grep -o '<version>[^<]*' | sed 's/<version>//' | grep -viE 'alpha|beta|rc|dev' | tail -3 | tr '\n' ' '; echo "<- $1"; }
          g com/android/tools/build/gradle; g androidx/compose/compose-bom; g androidx/activity/activity-compose
          g androidx/navigation/navigation-compose; g androidx/lifecycle/lifecycle-runtime-compose; g androidx/core/core-ktx
          g com/google/android/gms/play-services-cast-framework; g androidx/media3/media3-exoplayer
          g com/google/dagger/hilt-android; g androidx/datastore/datastore-preferences
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID || '0' }}" >> local.properties
          echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Guardar a chave de assinatura (primeira vez, só no main)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true # já guardada → o GitHub recusa regravar a mesma chave de cache, e tudo bem
        uses: actions/cache/save@v4
        with:
          path: ~/lumicast-debug.keystore
          key: lumicast-debug-keystore-v2
      - uses: actions/upload-artifact@v4
        with: { name: lumicast-debug-apk, path: app/build/outputs/apk/debug/*.apk }
